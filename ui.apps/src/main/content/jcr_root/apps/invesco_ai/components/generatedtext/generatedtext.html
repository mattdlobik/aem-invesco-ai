<div class="cmp-generated-text"
     data-sly-use.model="com.invesco.core.GeneratedTextComponent"
     data-path="${resource.path}">
    <!-- Render the generated content based on stock ticker from page property -->
    <div data-sly-test="${model.text}"
         class="cmp-generated-text__response"
         role="region"
         aria-live="polite">
        ${model.text @ context='html'}
    </div>
    <div data-sly-test="${!model.text && wcmmode.edit}"
         class="cmp-generated-text__placeholder">
        Please configure the prompt in the template to generate text based on ticker
    </div>
</div>
